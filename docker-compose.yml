services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/salary_management_production
      SECRET_KEY_BASE: local-only-insecure-secret-key-base-never-use-in-production
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/salary_management_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
